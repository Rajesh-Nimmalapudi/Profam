_target_: src.data.datamodule.ProteinDataMixture
dataset_builders:
  debug_train:
    _target_: src.data.builders.binary_dataset.BinaryMemmapDataset
    data_dir: ${paths.data_dir}
    name: debug_train
  debug_val:
    _target_: src.data.builders.binary_dataset.BinaryMemmapDataset
    data_dir: ${paths.data_dir}
    name: debug_val

# Default Params
batch_size: 2
data_dir: ${paths.data_dir}
num_workers: 0  # Sequential for debug stability
ignore_gaps: true
feature_names: ${constants.sequence_features}
pack_to_max_tokens: 8192 # Reduced from 52000 to prevent OOM on debug
prefetch_factor: null 
shuffle: true
interleaved: true
interleaved_block_size: 1000
data_weights:
  debug_train: 1.0
val_dataset_batch_sizes:
  debug_val: 1
